<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay Nights — 3D Open-World Crime Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ffd94d'/></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #101826; font-family: Arial, Helvetica, sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { background: rgba(9,16,28,.8); border: 1px solid rgba(255,255,255,.22); border-radius: 10px; }
  #topbar { position: absolute; top: 10px; right: 14px; text-align: right; text-shadow: 0 2px 6px rgba(0,0,0,.75); }
  #money { font-size: 30px; font-weight: bold; color: #93e8a2; }
  #clock { font-size: 15px; opacity: .92; }
  #stars { font-size: 25px; letter-spacing: 3px; color: #ffd94d; min-height: 30px; }
  #mission-card { position: absolute; top: 10px; left: 14px; padding: 10px 14px; max-width: 340px; border-color: rgba(255,217,77,.6); }
  #mission-job { font-size: 12px; color: #ffd94d; font-weight: bold; letter-spacing: 1px; }
  #mission-title { font-size: 21px; font-weight: bold; margin: 2px 0; }
  #mission-stage { font-size: 12px; opacity: .85; }
  #mission-objective { font-size: 14px; margin-top: 5px; }
  #mission-next { font-size: 12px; opacity: .75; margin-top: 3px; }
  #mission-timer { font-size: 17px; font-weight: bold; margin-top: 4px; color: #ffd94d; }
  #dispatch-panel { position: absolute; top: 196px; left: 14px; padding: 8px 12px; font-size: 12px; min-width: 238px; border-color: rgba(255,96,96,.55); background: rgba(34,10,14,.8); }
  #dispatch-tier { font-weight: bold; font-size: 13px; margin-bottom: 3px; color: #ffb3b3; }
  #dispatch-units div { opacity: .94; line-height: 1.5; white-space: nowrap; }
  #district-panel { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 7px 18px; text-align: center; }
  #district-name { font-size: 17px; font-weight: bold; }
  #district-respect { font-size: 11px; opacity: .85; }
  #radio-line { font-size: 12px; color: #5fe8ff; margin-top: 2px; }
  #minimap { position: absolute; left: 14px; bottom: 14px; border-radius: 50%; background: rgba(9,16,28,.65); border: 1px solid rgba(255,255,255,.25); }
  #speedo { position: absolute; right: 16px; bottom: 16px; text-align: right; padding: 8px 16px; }
  #speed-value { font-size: 52px; font-weight: bold; line-height: 1; }
  #speed-unit { font-size: 15px; opacity: .85; margin-left: 4px; }
  #vehicle-name { font-size: 14px; color: #ffd94d; }
  #vehicle-cond { font-size: 11px; opacity: .8; }
  #bars { position: absolute; right: 16px; bottom: 152px; width: 212px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-top: 5px; text-shadow: 0 1px 4px #000; }
  .bar { flex: 1; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); border-radius: 6px; overflow: hidden; }
  #hp-fill { height: 100%; background: #e84f4f; width: 100%; }
  #armor-fill { height: 100%; background: #4fa3e8; width: 25%; }
  #weapons { position: absolute; right: 16px; top: 128px; display: flex; flex-direction: column; gap: 5px; }
  .wslot { background: rgba(9,16,28,.78); border: 1px solid rgba(255,255,255,.3); border-radius: 7px; padding: 4px 10px; font-size: 12px; min-width: 172px; display: flex; justify-content: space-between; gap: 12px; }
  .wslot.active { border-color: #ffd94d; color: #ffd94d; }
  .wslot.locked { opacity: .45; }
  #dialogue { position: absolute; left: 50%; transform: translateX(-50%); bottom: 92px; display: none; gap: 12px; align-items: center; background: rgba(8,12,22,.9); border: 1px solid #ffd94d; border-radius: 12px; padding: 10px 16px; max-width: 640px; }
  #dialogue-portrait { width: 52px; height: 52px; border-radius: 50%; background: #ffd94d; color: #14202e; font-size: 28px; font-weight: bold; display: flex; align-items: center; justify-content: center; flex: none; }
  #dialogue-name { font-size: 12px; color: #ffd94d; font-weight: bold; letter-spacing: 1px; }
  #dialogue-text { font-size: 15px; line-height: 1.4; }
  #banner { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 36px; font-weight: bold; color: #ffd94d; text-shadow: 0 3px 12px #000; display: none; text-align: center; white-space: nowrap; }
  #tier-banner { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: bold; color: #ff6b6b; text-shadow: 0 3px 12px #000; display: none; text-align: center; white-space: nowrap; }
  #hint { position: absolute; bottom: 206px; left: 50%; transform: translateX(-50%); font-size: 14px; background: rgba(0,0,0,.55); padding: 5px 14px; border-radius: 8px; white-space: nowrap; }
  #hint:empty { display: none; }
  #controls-bar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 11px; opacity: .85; background: rgba(0,0,0,.4); padding: 4px 12px; border-radius: 8px; white-space: nowrap; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 20px; color: rgba(255,255,255,.85); text-shadow: 0 1px 4px #000; display: none; }
  #title-screen, #pause-screen, #wasted-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(6,10,18,.6); pointer-events: auto; text-align: center; padding: 20px; }
  #pause-screen, #wasted-screen { display: none; }
  #title-screen h1 { font-size: 58px; letter-spacing: 3px; color: #ffd94d; text-shadow: 0 4px 18px #000, 0 0 34px rgba(255,95,162,.7); }
  #title-screen .tag { font-size: 17px; }
  #title-screen .controls { font-size: 14px; line-height: 1.7; opacity: .92; }
  #start-btn { font-size: 19px; font-weight: bold; padding: 13px 36px; border: none; border-radius: 10px; background: #ffd94d; color: #14202e; cursor: pointer; }
  #start-btn:hover { background: #ffe27a; }
  #title-screen .small { font-size: 12px; opacity: .8; }
  #wasted-screen h2 { font-size: 66px; color: #ff4f4f; letter-spacing: 6px; }
  #pause-screen h2 { font-size: 42px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
